<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Brand Proposal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Caveat:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="card cover">
    <span class="sparkle s1">✦</span>
    <span class="sparkle s2">✦</span>
    <span class="sparkle s3">✦</span>
    <span class="sparkle s4">✦</span>
    <div class="cover-top">
      <p class="cover-label">Personal brand<br>proposal</p>
      <p class="cover-date" id="stamp-date">--</p>
    </div>
    <h1 class="cover-title">
      <span class="big-word">proposal</span>
      <span class="script-overlay">for <span id="client-name">Client Name</span></span>
    </h1>
    <div class="contact-row" id="contact-row"></div>
  </section>

  <section class="card peach problem">
    <p class="eyebrow" id="problem-eyebrow">why we're here</p>
    <h2 id="problem-heading"></h2>
    <p class="body-text" id="problem-body"></p>
  </section>

  <section class="card lavender pillars-section">
    <p class="eyebrow eyebrow-dark">the approach</p>
    <h2 class="section-title-dark">How this works</h2>
    <div class="pillars" id="pillars"></div>
  </section>

  <section class="card cream deliverables">
    <p class="eyebrow">what you get</p>
    <h2>The scope, plainly</h2>
    <ul id="deliverables-list"></ul>
  </section>

  <section class="card peach timeline">
    <p class="eyebrow">how it starts</p>
    <h2>First 30 days</h2>
    <div class="timeline-strip" id="timeline-strip"></div>
  </section>

  <section class="card cream pricing">
    <p class="eyebrow">investment</p>
    <h2>Pick a lane</h2>
    <div class="pricing-grid" id="pricing-grid"></div>
  </section>

  <section class="card lavender cta">
    <span class="sparkle s1">✦</span>
    <span class="sparkle s3">✦</span>
    <h2 id="cta-heading"></h2>
    <p id="cta-body"></p>
    <a href="#" id="cta-button" class="cta-button">Reply to lock this in →</a>
    <p class="footnote">This page is live — last updated <span id="footer-date">--</span>.</p>
  </section>

<script src="script.js"></script>
</body>
</html>
